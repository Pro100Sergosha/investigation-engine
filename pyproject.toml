[project]
name = "engine"
version = "0.1.0"
description = "Multi-source investigation engine with cited, evidence-based answers"
authors = [
    { name = "Pro100Sergosha", email = "prizrakgames21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "pg8000>=1.31.5",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.274.0",
    "constructs>=10.8.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import `eval` (the eval suite lives outside src/).
pythonpath = ["."]
