[project]
name = "engine"
version = "0.1.0"
description = "Multi-source investigation engine with cited, evidence-based answers"
authors = [
    { name = "Pro100Sergosha", email = "prizrakgames21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
