# investigation-deploy: on every push to main, deploy Investigation-prod, prove the deployed stack
# equals the code, and smoke-check the live URL. Status is reported to GitHub on the commit.
version: 0.2

env:
  shell: bash
  variables:
    CI: "true"
    NO_COLOR: "1"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - curl -LsSf https://astral.sh/uv/0.9.21/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
      - uv sync --frozen
  build:
    commands:
      - make test
      - make deploy
      - make verify
      - make smoke
