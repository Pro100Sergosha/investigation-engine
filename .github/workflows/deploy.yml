name: Deploy to production

# Production is the only environment: a merge to main goes live.
# Only Investigation-prod is deployed here. Investigation-Github-prod (the role this
# workflow assumes) is deployed by hand, so CI can never rewrite its own trust.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  check:
    name: lint, test, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: make check

  deploy:
    name: cdk deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv sync --frozen
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::988277499209:role/investigation-deploy
          aws-region: eu-north-1
      - name: Show what will change
        run: make diff
      - run: make deploy
      # Single environment, so this is the only proof that what was deployed answers.
      - name: Smoke check
        run: |
          url=$(aws cloudformation describe-stacks --stack-name Investigation-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl --fail --silent --show-error "${url}health"
